<!DOCTYPE html>
<html>

<head>

  <title>Signup Modal</title>

  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >

</head>

<body>

  <div class="container mt-5 text-center">

    <!-- Sign Up Button -->

    <button 
      type="button"
      class="btn btn-primary"
      data-bs-toggle="modal"
      data-bs-target="#signupModal"
    >
      Sign Up
    </button>

  </div>

  <!-- Modal -->

  <div 
    class="modal fade"
    id="signupModal"
    tabindex="-1"
  >

    <div class="modal-dialog modal-dialog-centered">

      <div class="modal-content">

        <!-- Modal Header -->

        <div class="modal-header">

          <h5 class="modal-title">
            Create Account
          </h5>

          <button 
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
          >
          </button>

        </div>

        <!-- Modal Body -->

        <div class="modal-body">

          <form>

            <!-- Email -->

            <div class="mb-3">

              <label 
                for="email-input"
                class="form-label"
              >
                Email address
              </label>

              <input 
                type="email"
                class="form-control"
                id="email-input"
                placeholder="Enter email"
              >

              <div class="form-text">
                Your information is safe with us.
              </div>

            </div>

            <!-- Password -->

            <div class="mb-3">

              <label 
                for="password-input"
                class="form-label"
              >
                Password
              </label>

              <input 
                type="password"
                class="form-control"
                id="password-input"
                placeholder="Password"
              >

            </div>

            <!-- Confirm Password -->

            <div class="mb-3">

              <label 
                for="confirm-password-input"
                class="form-label"
              >
                Confirm Password
              </label>

              <input 
                type="password"
                class="form-control"
                id="confirm-password-input"
                placeholder="Confirm Password"
              >

            </div>

            <!-- Submit Button -->

            <button 
              type="submit"
              class="btn btn-primary"
            >
              Submit
            </button>

          </form>

        </div>

      </div>

    </div>

  </div>

  <!-- Bootstrap JS -->

  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>

</body>

</html>
